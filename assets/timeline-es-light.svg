<line x1="110" y1="172" x2="790" y2="172" stroke="#d8dee4" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="172" x2="790" y2="172" stroke="url(#grad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="680" style="animation: draw 2.4s ease-in-out .2s both"/><g style="animation: fadeUp .6s ease-out 0.30s both">
  <line x1="110.0" y1="150" x2="110.0" y2="160" stroke="#d0d7de" stroke-width="1.5"/>
