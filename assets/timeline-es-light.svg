<svg xmlns="http://www.w3.org/2000/svg" width="900" height="292" viewBox="0 0 900 292" role="img" aria-label="Career timeline">
<title>Career timeline</title>
<defs>
  <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a5cff"/><stop offset="1" stop-color="#0891b2"/>
  </linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#e3e8ef"/>
  </pattern>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0891b2" stop-opacity="0.16"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  .mono { font-family: 'JetBrains Mono','Fira Code','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace; }
  .sans { font-family: 'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes pulse { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
  @keyframes draw { from { stroke-dashoffset: 680; } to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
  .node { transform-box: fill-box; transform-origin: center; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out 2.6s infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="900" height="292" rx="16" fill="#ffffff"/>
<rect width="900" height="292" rx="16" fill="url(#dots)"/>
<rect x="0" y="0" width="900" height="36" rx="12" fill="#eef1f4"/>
<rect x="0" y="24" width="900" height="12" fill="#eef1f4"/>
<line x1="0" y1="36" x2="900" y2="36" stroke="#d0d7de"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/>
<circle cx="40" cy="18" r="6" fill="#febc2e"/>
<circle cx="60" cy="18" r="6" fill="#28c840"/>
