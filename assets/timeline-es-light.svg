  <text x="518.0" y="268" class="mono" font-size="11" fill="#4a5cff" text-anchor="middle">Cypress · JMeter</text>
</g>
<circle class="node" cx="518.0" cy="172" r="7" fill="#f6f8fa" stroke="#4a5cff" stroke-width="2.5" style="animation: pop .45s cubic-bezier(.3,1.6,.5,1) 1.64s both"/><g style="animation: fadeUp .6s ease-out 2.22s both">
  <line x1="654.0" y1="150" x2="654.0" y2="160" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="654.0" y="86" class="mono" font-size="13" fill="#0891b2" text-anchor="middle">2024</text>
  <text x="654.0" y="106" class="sans" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle">Enmedio</text>
  <text x="654.0" y="124" class="sans" font-size="12.5" fill="#59636e" text-anchor="middle">Analista QA · medios</text>
  <text x="654.0" y="142" class="mono" font-size="11" fill="#4a5cff" text-anchor="middle">Cypress · Playwright</text>
</g>
<circle class="node" cx="654.0" cy="172" r="7" fill="#f6f8fa" stroke="#4a5cff" stroke-width="2.5" style="animation: pop .45s cubic-bezier(.3,1.6,.5,1) 2.12s both"/><g style="animation: fadeUp .6s ease-out 2.70s both">
  <line x1="790.0" y1="184" x2="790.0" y2="194" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790.0" y="212" class="mono" font-size="13" fill="#0891b2" text-anchor="middle">2025</text>
