  <text x="790.0" y="268" class="mono" font-size="11" fill="#4a5cff" text-anchor="middle">Playwright · Claude agents</text>
</g>
<circle class="pulse" cx="790.0" cy="172" r="9" fill="none" stroke="#0891b2" stroke-width="2"/><circle class="node" cx="790.0" cy="172" r="9" fill="url(#grad)" stroke="#4a5cff" stroke-width="2.5" style="animation: pop .45s cubic-bezier(.3,1.6,.5,1) 2.60s both"/>
<rect x="0.5" y="0.5" width="899" height="291" rx="15.5" fill="none" stroke="#d0d7de"/>
